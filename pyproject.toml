[project]
name = "aerospace-copilot"
version = "0.1.0"
description = "Aerospace Analyst Copilot - production-shaped agentic RAG over EDGAR, NTSB, Launch Library 2"
requires-python = ">=3.12,<3.13"
dependencies = [
    # api layer (W1)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # db + migrations (W2)
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    # ingestion (W2-3)
    "httpx>=0.27",
    "tenacity>=8.4",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pandas>=2.2",
    "tiktoken>=0.7",
    # retrieval (W4-6)
    "qdrant-client>=1.10",
    "torch>=2.4",                    # direct dep: [tool.uv.sources] only routes DIRECT deps to the CPU index
    "sentence-transformers>=3.0",   # bge-reranker-base; torch resolves CPU via index below
    # gateway + tracing (W5)
    "litellm==1.105.0",
    "langfuse>=2.40",
    "logfire>=0.50",
    # agent (W7-9) — pin the resolved versions in uv.lock and upgrade in a branch
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=1.0",
    # ui (W5/W11)
    "chainlit>=1.1",
    # ops (W12-14)
    "prometheus-client>=0.20",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "pybreaker>=1.2",
    # evals + misc
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "py-spy>=0.3",
]
evals = [
    "ragas>=0.2",                    # Layer-1 metric engine (D31); optional install
]

# --- CPU-only torch (saves ~2.5 GB vs CUDA wheel; per WSL2 setup sheet) ---
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "TID251"]

# D32: env access only via config.py — enforced, not suggested
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read settings via src.config only (D32)"
"os.getenv".msg = "Read settings via src.config only (D32)"

[tool.ruff.lint.per-file-ignores]
"src/config.py" = ["TID251"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
